name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: '124355645722'
  ECR_REPOSITORY: todo-app
  ARTIFACT_BUCKET: todo-app-cicd-artifacts-124355645722
  ECS_TASK_DEFINITION_FAMILY: todo-app-task
  CONTAINER_NAME: app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/todo-app-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      # Derive taskdef.json from whatever task definition is actually live
      # right now (created by CloudFormation initially, or by a previous
      # deploy after that) so real values (RDS Proxy endpoint, DB secret
      # ARN, Redis host/port) are always correct - only the image
      # placeholder changes here. CodePipeline substitutes <IMAGE1_NAME>
      # with the resolved digest of whatever's pushed to :latest below.
      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy-bundle
          cp deploy/appspec.yaml deploy-bundle/appspec.yaml

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FAMILY" \
            --query 'taskDefinition' > raw-taskdef.json

          jq --arg name "$CONTAINER_NAME" '
            .containerDefinitions = [
              .containerDefinitions[] |
              if .name == $name then .image = "<IMAGE1_NAME>" else . end
            ] |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
          ' raw-taskdef.json > deploy-bundle/taskdef.json

          cd deploy-bundle
          zip -r ../deploy-bundle.zip appspec.yaml taskdef.json

      - name: Upload deploy bundle to S3
        run: aws s3 cp deploy-bundle.zip "s3://$ARTIFACT_BUCKET/deploy/deploy-bundle.zip"

      # Pushed after the deploy bundle is already in S3, deliberately:
      # EventBridge/CodePipeline trigger off this push, and the bundle needs
      # to already be there by the time that happens.
      - name: Push latest tag (triggers the deployment pipeline)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
